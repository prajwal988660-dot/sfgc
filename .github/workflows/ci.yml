# Typecheck, test and build every workspace on push.
#
# Until now the 52 tests ran only when somebody remembered to run them. That was
# survivable when authorisation was a handful of role comparisons; it stopped
# being survivable when it became a permission table, because the failure mode
# there is silent — a wrong grant does not throw, it just says yes to the wrong
# person. Several of those tests exist specifically to fail if a closed
# vulnerability is reopened, and a test that only runs by hand cannot do that.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# A second push supersedes the first: nobody needs the results of a commit that
# has already been replaced, and the free minutes are better spent on the tip.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Matches NODE_VERSION on the deployed API. Testing on a different
          # major to the one production runs is how a passing build ships a
          # runtime failure.
          node-version: '22'
          cache: npm

      # `npm ci` needs the lockfile to match package.json exactly, which is the
      # point — it fails loudly on a lockfile someone forgot to commit.
      - name: Install
        run: npm ci

      # Prisma Client is generated code that nothing commits, and every
      # workspace that imports the schema's types needs it before tsc runs.
      # DATABASE_URL is required for the generator to parse the datasource but
      # is never connected to — no CI job touches the real database.
      - name: Generate Prisma Client
        run: npm run db:generate
        env:
          DATABASE_URL: postgresql://user:pass@localhost:5432/db?schema=sfgc_platform
          DIRECT_URL: postgresql://user:pass@localhost:5432/db?schema=sfgc_platform

      - name: Typecheck every workspace
        run: npm run typecheck

      - name: Test
        run: npm run test --workspace backend

      # Catches what typecheck cannot: a Next.js build failure, a bad import in
      # a route file, a page that cannot be prerendered.
      - name: Build
        run: npm run build
        env:
          DATABASE_URL: postgresql://user:pass@localhost:5432/db?schema=sfgc_platform
          DIRECT_URL: postgresql://user:pass@localhost:5432/db?schema=sfgc_platform
          JWT_SECRET: ci-only-secret-not-used-for-anything-real
          NEXT_PUBLIC_API_URL: https://sfgc-api.onrender.com/api
          API_URL: https://sfgc-api.onrender.com/api
