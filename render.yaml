# Render Blueprint for the SFGC API.
#
# In the Render dashboard: New -> Blueprint -> connect this repository.
# Render reads this file and creates the service; you then paste the two
# database URLs (marked `sync: false`) into the dashboard, because secrets must
# never live in the repository.
#
# Deploys the BACKEND ONLY. The website is a separate Vercel project, and the
# database is your existing Supabase project — neither is created here.

services:
  - type: web
    name: sfgc-api
    runtime: node
    plan: free
    # Singapore is Render's closest region to the Supabase project in
    # ap-south-1 (Mumbai). Frankfurt or Oregon would add ~150ms per query.
    region: singapore

    # Installs ONLY the backend workspace plus the root lockfile entries.
    #
    # A plain `npm install` here would also pull Next.js, React Native and both
    # Expo apps — over a gigabyte of node_modules that the API never imports,
    # which exhausts the 512 MB free instance and fails the build. The backend
    # deliberately has no dependency on @sfgc/shared, so this is everything it
    # needs. `postinstall` in backend/package.json runs `prisma generate`.
    # `--include=dev` is REQUIRED. NODE_ENV=production is set below, and npm
    # then omits devDependencies by default — which drops typescript and every
    # @types/* package, so `tsc` fails with "Could not find a declaration file
    # for module 'express'". The build needs them; the running server does not.
    buildCommand: npm install --workspace backend --include-workspace-root --include=dev && npm run build --workspace backend
    startCommand: node backend/dist/server.js

    # Render restarts the service if this stops returning 200. The route
    # answers 200 even when the database is unreachable (reporting db: "down"),
    # so a Supabase blip does not trigger a restart loop.
    healthCheckPath: /api/health

    envVars:
      - key: NODE_VERSION
        value: "22"

      - key: NODE_ENV
        value: production

      # Render assigns the port at runtime and injects it here.
      - key: PORT
        value: "10000"

      # ---------------------------------------------------------------------
      # Set these in the Render dashboard, NOT here.
      #
      # IMPORTANT: use the POOLER host (aws-1-ap-south-1.pooler.supabase.com),
      # not db.<ref>.supabase.co. The direct host is IPv6-only and Render's
      # outbound network is IPv4, so the direct host will simply time out.
      #
      # DATABASE_URL (runtime, transaction pooling, port 6543):
      #   postgresql://postgres.omqvpahtcuwxpvdnxjlq:PASSWORD@aws-1-ap-south-1.pooler.supabase.com:6543/postgres?pgbouncer=true&connection_limit=10&schema=sfgc_platform&pool_timeout=20
      #
      # connection_limit=10, not 1. One connection means the entire API is
      # serialised through it: `authenticate` reads the user row on every
      # request before the handler runs, so a single class screen costs four
      # round trips, and every Promise.all in the codebase is decorative —
      # the pairs queue instead of overlapping. Supabase's transaction pooler
      # handles 10 from one instance comfortably.
      #
      # pool_timeout=20 because Prisma's default is 10s, and a request that
      # waits longer fails with P2024 rather than merely being slow. That is
      # what took the admin panel down at 47 users.
      #
      # DIRECT_URL (migrations, session pooling, port 5432):
      #   postgresql://postgres.omqvpahtcuwxpvdnxjlq:PASSWORD@aws-1-ap-south-1.pooler.supabase.com:5432/postgres?schema=sfgc_platform
      #
      # Keep ?schema=sfgc_platform — the new platform's tables live in that
      # schema so they do not collide with the legacy Vite app's tables in
      # `public`.
      # ---------------------------------------------------------------------
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false

      # Generated once by Render and kept across deploys. Do not reuse the
      # local development secret in production.
      - key: JWT_SECRET
        generateValue: true

      - key: JWT_EXPIRES_IN
        value: 7d

      # Browser origins allowed to call the API. The mobile apps send no Origin
      # header and are always allowed — they are authorised by their JWT, not
      # their origin.
      #
      # Managed here rather than `sync: false`, unlike the entries above. An
      # allow-list of public URLs is not a secret: nothing about it needs
      # hiding, and keeping it in the repository means a change to who may call
      # this API shows up in a diff instead of only in someone's dashboard.
      #
      # Exact string match, no wildcards — see app.ts. So this is the
      # production alias only. Vercel preview deployments get unique hostnames
      # and are deliberately NOT allowed to call the production API; localhost
      # is absent for the same reason, since local development runs against a
      # local API.
      - key: CORS_ORIGINS
        value: https://sfgc-hazel.vercel.app
