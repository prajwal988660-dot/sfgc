<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" role="img" aria-label="SFGC">
  <!-- Interim monogram seal. Replace this file with the college's official
       crest (same name, square artwork) and every page picks it up. -->
  <circle cx="60" cy="60" r="58" fill="#0f2b56"/>
  <circle cx="60" cy="60" r="52" fill="none" stroke="#c9a227" stroke-width="2"/>
  <circle cx="60" cy="60" r="47" fill="none" stroke="#c9a227" stroke-width="0.75" opacity="0.7"/>
  <text x="60" y="68" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif"
        font-size="27" font-weight="700" letter-spacing="1" fill="#ffffff">SFGC</text>
  <line x1="36" y1="78" x2="84" y2="78" stroke="#c9a227" stroke-width="1"/>
  <text x="60" y="92" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif"
        font-size="9" letter-spacing="2.5" fill="#e9d38a">EST. 1930</text>
  <text x="60" y="41" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif"
        font-size="7.5" letter-spacing="2" fill="#e9d38a">BENGALURU</text>
</svg>
